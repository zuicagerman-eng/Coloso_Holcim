<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><?!= incluir('estilos') ?>
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .barra {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .barra .titulo { flex: 1; min-width: 180px; }
  .barra .titulo b { display: block; font-size: 14.5px; }
  .barra .titulo span { color: var(--muted); font-size: 12.5px; }
  .barra .boton { margin-top: 0; padding: 8px 16px; font-size: 13.5px; }
  .lienzo { flex: 1; min-height: 0; background: var(--surface); }
  .lienzo iframe { display: block; width: 100%; height: 100%; border: 0; }
  .centrado { display: grid; place-items: center; padding: 40px 22px; }
</style>
</head>
<body>
<div class="barra">
  <a class="volver" style="margin:0" href="<?= urlCurso ?>">← <?= curso.nombre ?></a>
  <span class="titulo">
    <b><?= modulo.nombre ?></b>
    <span>Parte <?= numero ?> de <?= total ?><? if (modulo.minutos) { ?> · <?= modulo.minutos ?> min<? } ?></span>
  </span>
  <? if (urlAnterior) { ?><a class="boton hueco" href="<?= urlAnterior ?>">Anterior</a><? } ?>
  <? if (urlSiguiente) { ?><a class="boton" href="<?= urlSiguiente ?>">Siguiente</a><? } else { ?>
    <a class="boton" href="<?= urlCurso ?>">Terminar</a>
  <? } ?>
</div>
<div class="filo"></div>

<? if (visor.modo === 'marco') { ?>
  <div class="lienzo">
    <iframe src="<?= visor.src ?>" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>
  <? if (visor.aviso) { ?><p class="aviso" style="margin:0 18px 14px"><?= visor.aviso ?></p><? } ?>
<? } else { ?>
  <div class="lienzo centrado">
    <div class="tarjeta" style="max-width:460px;text-align:center">
      <h2 style="margin:0 0 8px;font-size:17px"><?= modulo.nombre ?></h2>
      <p style="margin:0;color:var(--muted);font-size:13.5px">
        Esta parte está por fuera del entorno. Se abre en una pestaña nueva;
        cuando termine, vuelva aquí y siga con la siguiente.</p>
      <a class="boton" href="<?= visor.src ?>" target="_blank" rel="noopener">Abrir</a>
    </div>
  </div>
<? } ?>
</body>
</html>
