<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= incluir('ui/estilos') ?>
</head>
<body>
  <header class="barra">
    <div class="marca">Holcim</div>
    <h1><?= nombreApp ?></h1>
  </header>

  <main class="contenedor">
    <div class="pestanas" role="tablist">
      <button class="pestana" id="tabEmpresa" role="tab" aria-selected="true"
              onclick="mostrar('empresa')">1. Empresa</button>
      <button class="pestana" id="tabPersona" role="tab" aria-selected="false"
              onclick="mostrar('persona')">2. Personas</button>
    </div>

    <div id="mensaje"></div>

    <!-- ---------------- Empresa ---------------- -->
    <section class="tarjeta" id="panelEmpresa">
      <form id="formEmpresa" onsubmit="enviarEmpresa(event)">
        <div class="campo">
          <label for="nit">NIT
            <span class="ayuda">Sin dígito de verificación y sin guion. Ej.: 900123456</span>
          </label>
          <input id="nit" name="nit" inputmode="numeric" maxlength="10" required>
        </div>
        <div class="campo">
          <label for="nombreEmpresa">Nombre de la empresa</label>
          <input id="nombreEmpresa" name="nombre" required>
        </div>
        <div class="rejilla">
          <div class="campo">
            <label for="correoEmpresa">Correo</label>
            <input id="correoEmpresa" name="correo" type="email" required>
          </div>
          <div class="campo">
            <label for="contacto">Contacto
              <span class="ayuda">Nombre y teléfono</span>
            </label>
            <input id="contacto" name="contacto" required>
          </div>
        </div>
        <button class="boton" type="submit" id="btnEmpresa">Registrar empresa</button>
      </form>
    </section>

    <!-- ---------------- Personas ---------------- -->
    <section class="tarjeta oculto" id="panelPersona">
      <form id="formPersona" onsubmit="enviarPersona(event)">
        <div class="rejilla">
          <div class="campo">
            <label for="nombres">Nombres</label>
            <input id="nombres" name="nombres" required>
          </div>
          <div class="campo">
            <label for="apellidos">Apellidos</label>
            <input id="apellidos" name="apellidos" required>
          </div>
          <div class="campo">
            <label for="cedula">Cédula</label>
            <input id="cedula" name="cedula" inputmode="numeric" maxlength="10" required>
          </div>
          <div class="campo">
            <label for="correoPersona">Correo</label>
            <input id="correoPersona" name="correo" type="email" required>
          </div>
        </div>
        <div class="campo">
          <label for="empresa">Empresa
            <span class="ayuda">Debe estar registrada previamente en la pestaña 1</span>
          </label>
          <select id="empresa" name="nitEmpresa" required>
            <option value="">Cargando empresas…</option>
          </select>
        </div>
        <button class="boton" type="submit" id="btnPersona">Registrar persona</button>
      </form>
    </section>

    <p class="pie">Al registrar, el sistema guarda en la hoja de cálculo y notifica automáticamente a las áreas de Holcim.</p>
  </main>

  <script>
    function mostrar(cual) {
      var esEmpresa = cual === 'empresa';
      document.getElementById('panelEmpresa').classList.toggle('oculto', !esEmpresa);
      document.getElementById('panelPersona').classList.toggle('oculto', esEmpresa);
      document.getElementById('tabEmpresa').setAttribute('aria-selected', esEmpresa);
      document.getElementById('tabPersona').setAttribute('aria-selected', !esEmpresa);
      limpiarMensaje();
      if (!esEmpresa) cargarEmpresas();
    }

    function limpiarMensaje() {
      document.getElementById('mensaje').innerHTML = '';
    }

    function mostrarErrores(errores) {
      var lista = errores.map(function (e) { return '<li>' + e + '</li>'; }).join('');
      document.getElementById('mensaje').innerHTML =
        '<div class="aviso aviso-error"><b>Revise lo siguiente:</b><ul>' + lista + '</ul></div>';
      window.scrollTo(0, 0);
    }

    function mostrarExito(texto) {
      document.getElementById('mensaje').innerHTML =
        '<div class="aviso aviso-ok">' + texto + ' Se notificó por correo a las áreas responsables.</div>';
      window.scrollTo(0, 0);
    }

    function ocupado(idBoton, activo, textoOriginal) {
      var btn = document.getElementById(idBoton);
      btn.disabled = activo;
      btn.textContent = activo ? 'Enviando…' : textoOriginal;
    }

    function datosDelFormulario(idFormulario) {
      var datos = {};
      new FormData(document.getElementById(idFormulario)).forEach(function (valor, llave) {
        datos[llave] = valor;
      });
      return datos;
    }

    function enviarEmpresa(evento) {
      evento.preventDefault();
      limpiarMensaje();
      ocupado('btnEmpresa', true);
      google.script.run
        .withSuccessHandler(function (r) {
          ocupado('btnEmpresa', false, 'Registrar empresa');
          if (r.ok) {
            mostrarExito(r.mensaje);
            document.getElementById('formEmpresa').reset();
            empresasCargadas = false;
          } else {
            mostrarErrores(r.errores);
          }
        })
        .withFailureHandler(function (e) {
          ocupado('btnEmpresa', false, 'Registrar empresa');
          mostrarErrores([e.message]);
        })
        .registrarEmpresa(datosDelFormulario('formEmpresa'));
    }

    function enviarPersona(evento) {
      evento.preventDefault();
      limpiarMensaje();
      ocupado('btnPersona', true);
      google.script.run
        .withSuccessHandler(function (r) {
          ocupado('btnPersona', false, 'Registrar persona');
          if (r.ok) {
            mostrarExito(r.mensaje);
            document.getElementById('formPersona').reset();
          } else {
            mostrarErrores(r.errores);
          }
        })
        .withFailureHandler(function (e) {
          ocupado('btnPersona', false, 'Registrar persona');
          mostrarErrores([e.message]);
        })
        .registrarPersona(datosDelFormulario('formPersona'));
    }

    var empresasCargadas = false;
    function cargarEmpresas() {
      if (empresasCargadas) return;
      google.script.run
        .withSuccessHandler(function (empresas) {
          var select = document.getElementById('empresa');
          if (!empresas.length) {
            select.innerHTML = '<option value="">No hay empresas registradas todavía</option>';
            return;
          }
          select.innerHTML = '<option value="">Seleccione la empresa…</option>' +
            empresas.map(function (e) {
              return '<option value="' + e.nit + '">' + e.nombre + ' — NIT ' + e.nit + '</option>';
            }).join('');
          empresasCargadas = true;
        })
        .withFailureHandler(function (e) { mostrarErrores([e.message]); })
        .listarEmpresas();
    }
  </script>
</body>
</html>
