<style>
  /* Identidad visual Holcim. Cambie estas variables para ajustar la marca. */
  :root {
    --hlc-verde: #00A758;
    --hlc-verde-oscuro: #046A38;
    --hlc-tinta: #1D1D1B;
    --hlc-gris: #6B7280;
    --hlc-linea: #E5E7EB;
    --hlc-fondo: #F3F4F6;
    --hlc-error: #C0392B;
    --hlc-ok: #046A38;
    --radio: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--hlc-fondo);
    color: var(--hlc-tinta);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .barra {
    background: var(--hlc-verde);
    color: #fff;
    padding: 18px 24px;
  }
  .barra .marca {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: .9;
  }
  .barra h1 { margin: 4px 0 0; font-size: 20px; font-weight: 600; }

  .contenedor { max-width: 780px; margin: 24px auto 48px; padding: 0 16px; }

  .tarjeta {
    background: #fff;
    border: 1px solid var(--hlc-linea);
    border-radius: var(--radio);
    padding: 24px;
  }

  .pestanas { display: flex; gap: 8px; margin-bottom: 16px; }
  .pestana {
    flex: 1;
    padding: 12px 16px;
    background: #fff;
    border: 1px solid var(--hlc-linea);
    border-radius: var(--radio);
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    color: var(--hlc-gris);
  }
  .pestana[aria-selected="true"] {
    background: var(--hlc-verde);
    border-color: var(--hlc-verde);
    color: #fff;
  }

  .campo { margin-bottom: 16px; }
  .campo label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .campo .ayuda { display: block; font-weight: 400; color: var(--hlc-gris); font-size: 12px; margin-top: 2px; }

  input, select, textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--hlc-linea);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    background: #fff;
    color: var(--hlc-tinta);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--hlc-verde);
    box-shadow: 0 0 0 3px rgba(0, 167, 88, .15);
  }
  textarea { min-height: 96px; resize: vertical; }

  .rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 620px) { .rejilla { grid-template-columns: 1fr; } }

  .boton {
    background: var(--hlc-verde);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px 28px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .boton:hover { background: var(--hlc-verde-oscuro); }
  .boton[disabled] { background: #9CA3AF; cursor: progress; }
  .boton-secundario {
    background: #fff;
    color: var(--hlc-tinta);
    border: 1px solid var(--hlc-linea);
  }
  .boton-secundario:hover { background: var(--hlc-fondo); }

  .aviso { padding: 14px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .aviso-error { background: #FDECEA; border: 1px solid #F5C6C2; color: var(--hlc-error); }
  .aviso-ok { background: #E8F6EE; border: 1px solid #B7E2C9; color: var(--hlc-ok); }
  .aviso ul { margin: 6px 0 0 18px; padding: 0; }

  .resumen { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
  .resumen td { border: 1px solid var(--hlc-linea); padding: 9px 12px; }
  .resumen td:first-child { background: #F9FAFB; color: var(--hlc-gris); width: 42%; }

  .pie { text-align: center; color: var(--hlc-gris); font-size: 12px; margin-top: 20px; }
  .oculto { display: none; }
</style>
