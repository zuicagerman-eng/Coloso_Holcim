<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title><?= titulo ?></title>
<style>
  :root {
    --marca: #00457C;
    --ground: #EFF3F7;
    --surface: #FFFFFF;
    --line: #D8E0E8;
    --line-fuerte: #B4C2D0;
    --ink: #0F2438;
    --muted: #59697A;
    --cian: #00AEEF;
    --verde: #00A94F;
    --danger: #B3261E;
    --danger-suave: #FBEAE8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .tarjeta {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(15,36,56,.05), 0 12px 32px -22px rgba(15,36,56,.5);
    overflow: hidden;
  }
  .filo { height: 3px; background: linear-gradient(90deg, var(--verde), var(--cian)); }
  .cuerpo { padding: 28px; }
  .marca {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .16em;
    color: var(--marca);
    margin: 0 0 22px;
  }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
  p.explicacion { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line-fuerte);
    border-radius: 4px;
    font: inherit;
    font-family: "Consolas", "Menlo", monospace;
    letter-spacing: .04em;
    color: var(--ink);
  }
  input:focus {
    outline: none;
    border-color: var(--marca);
    box-shadow: 0 0 0 3px #E3EDF6;
  }
  .error {
    display: block;
    margin-top: 8px;
    padding: 9px 11px;
    background: var(--danger-suave);
    border-radius: 4px;
    color: var(--danger);
    font-size: 13px;
  }
  .error:empty { display: none; }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    background: var(--marca);
    border: 1px solid var(--marca);
    border-radius: 4px;
    color: #FFFFFF;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #003762; }
  .pie { margin: 18px 0 0; color: var(--muted); font-size: 12.5px; text-align: center; }
</style>
</head>
<body>
<div class="tarjeta">
  <div class="filo"></div>
  <div class="cuerpo">
    <p class="marca">HOLCIM</p>
    <h1><?= titulo ?></h1>
    <p class="explicacion">Esta página es privada. Escriba la clave que le
       entregaron para entrar.</p>

    <form onsubmit="entrar(event)">
      <label for="clave">Clave</label>
      <input id="clave" autocomplete="off" spellcheck="false"
             placeholder="HOLCIM-0000-0000-0000" autofocus>
      <span class="error" id="aviso"><?= mensaje ?></span>
      <button type="submit">Entrar</button>
    </form>

    <p class="pie">¿No tiene clave? Pídala a quien lo convocó.</p>
  </div>
</div>

<script>
/* La página vive dentro de un marco: para recargarla con la clave hay que
   mover la ventana de arriba, no el marco. */
function entrar(evento) {
  evento.preventDefault();
  var escrita = document.getElementById('clave').value.trim().toUpperCase().replace(/\s+/g, '');
  if (!escrita) {
    document.getElementById('aviso').textContent = 'Escriba la clave.';
    return;
  }
  window.top.location.href = '<?= url ?>?clave=' + encodeURIComponent(escrita);
}
</script>
</body>
</html>
